// TabMates desktop packaging + silent self-update for macOS, Windows and Linux.
// Conveyor builds signed, auto-updating distributions; apps poll site.base-url on launch and
// update themselves in the background (applied on next restart).
// Docs: https://conveyor.hydraulic.dev/

// Pulls mainClass, runtime classpath, JDK and version from the Gradle build (see desktopApp).
include "#!./gradlew -q :desktopApp:printConveyorConfig"

app {
  display-name = "TabMates"
  fsname = "tabmates"
  rdns-name = "de.tabmates.app"
  vendor = "TabMates"

  // REQUIRED: where update metadata + packages are hosted. Without a reachable URL there is no
  // auto-update. e.g. an S3/CDN bucket or GitHub Releases ("github:TabMates/app").
  site.base-url = "https://downloads.tabmates.de"  // TODO: set real host

  // TODO: app icons — provide a square PNG/SVG; Conveyor derives per-OS icons.
  // icons = "composeApp/icons/icon.svg"

  mac {
    // TODO: signing + notarization (required, else macOS Gatekeeper blocks launch/update).
    //   signing-key / certificate + notarization.app-specific-password (or App Store Connect API key).
    // info-plist.LSMinimumSystemVersion = "12.0"
  }

  windows {
    // TODO: Authenticode signing (else SmartScreen warns on install/update).
  }

  linux {
    // Produces .deb plus a self-updating tarball by default.
  }
}

conveyor.compatibility-level = 18
