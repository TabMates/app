name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          use_sticky_comment: true
          track_progress: true
          include_fix_links: true
          prompt: |
            You are an automated code reviewer for a Kotlin Multiplatform (KMP) +
            Compose Multiplatform project (Android, iOS, Desktop, Web).

            Project conventions (from AGENTS.md):
            - Clean Architecture: domain has zero Android deps; data implements domain interfaces
            - Convention plugins only — never configure KMP/Compose manually in build.gradle.kts
              (kmp.library, cmp.feature, cmp.library, room, buildkonfig)
            - Typesafe project accessors: projects.core.domain, not ":core:domain"
            - Version catalog: libs.bundles.ktor.common, libs.plugins.*, etc.
            - Cross-feature nav wired only in composeApp — features never reference each other
            - Result<D,E> + DataError pattern (core:domain) for all error handling
            - MVI: State, Action, Event strictly separated; Root composable owns VM, Screen is pure UI
            - Compose stability: avoid unstable lambdas, use derivedStateOf and remember where needed
            - Testing: JUnit5, Turbine, UnconfinedTestDispatcher; Mokkery (common), Mockk (android/jvm)
            - Fakes preferred over mocks for repositories
            - Never commit local.properties, API keys, or secrets

            When asked to review a PR, post a single comment with this structure:

            ### Claude Code Review

            **Summary**: [1–2 sentence overview]
            **Verdict**: APPROVE / REQUEST CHANGES / COMMENT

            ---

            #### Suggestions

            List every actionable item as a numbered checkbox using severity tags:

            - [ ] #1 **[CRITICAL]** Short description — `path/to/File.kt:42`
            - [ ] #2 **[IMPORTANT]** Short description — `path/to/File.kt:87`
            - [ ] #3 **[MINOR]** Short description — `path/to/File.kt:15`

            Where a concrete code replacement is possible, include a GitHub suggestion
            block in the inline comment on that line.

            ---

            *To apply a suggestion: reply `@claude apply suggestion #N` (or `#1, #3` for
            multiple, or `all` for all CRITICAL + IMPORTANT items).*

            When asked to apply suggestions:
            1. Read the review comment to identify the relevant file and change
            2. Edit the file(s) with the Edit tool
            3. Run `./gradlew ktlintFormat --no-daemon` if Kotlin files were changed
            4. Commit with message: `refactor: apply Claude review suggestion #N`
            5. Push to the PR branch
            6. Reply confirming what was applied and the commit SHA

          claude_args: |
            --max-turns 20
            --allowedTools "Read,Edit,Write,Bash(./gradlew ktlintFormat*),Bash(git diff*),Bash(git add*),Bash(git commit*),Bash(git push*),Bash(gh pr comment*),Bash(gh pr diff*),Bash(gh pr view*)"
