name: Release Pipeline

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  android-release:
    name: Android · AppBundle Release
    # Manual dispatch has no tag ref, so get-version-action / the release flow
    # would be meaningless — only run this chain on an actual tag push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ./.github/workflows/release-android.yml
    secrets: inherit

  web-deploy:
    name: Web · Deploy to Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit
