name: Release

on:
  workflow_call:
    inputs:
      app_version:
        description: 'Version this build reports, without the leading v. Resolved by release-pipeline.yml.'
        required: true
        type: string

env:
  API_KEY: ${{ secrets.API_KEY }}
  BASE_URL_HTTP: ${{ secrets.BASE_URL_HTTP }}
  BASE_URL_PUBLIC: https://app.tabmates.de

jobs:
  build-appbundle:
    name: Build Signed AppBundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Proves to the backend's client-version gate that this artifact really is the version it
      # claims. The secret stays here; only the derived token is baked into the AAB, so extracting
      # a released build yields a token for that one version and nothing else. `printf`, not `echo`:
      # a trailing newline changes the HMAC and the server would reject every request.
      # The canonical message "<platform>|<version>" must match ClientVersion.canonical() on the
      # server byte for byte.
      - name: Mint client build token
        id: build_token
        env:
          CLIENT_BUILD_SECRET: ${{ secrets.CLIENT_BUILD_SECRET }}
          VERSION: ${{ inputs.app_version }}
        run: |
          # An unset secret is the dangerous case: `openssl -hmac ""` succeeds and produces a
          # perfectly well-formed token that the server will reject, so the release ships broken
          # and nothing in this log says why.
          if [[ -z "$CLIENT_BUILD_SECRET" ]]; then
            echo "::error::CLIENT_BUILD_SECRET is not set — the minted token would not verify."
            exit 1
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::app_version input is empty."
            exit 1
          fi
          TOKEN=$(printf 'android|%s' "$VERSION" \
            | openssl dgst -sha256 -hmac "$CLIENT_BUILD_SECRET" -binary \
            | basenc --base64url | tr -d '=')
          # Only registered secrets are masked automatically, and this one is derived — without
          # this it prints in plain text anywhere a later step happens to dump the environment.
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Decode Keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'upload_keystore.jks'
          fileDir: 'androidApp/keystore/'
          encodedString: ${{ secrets.KEYSTORE_PLAY_STORE }}

      # Overwrites the committed dummy google-services.json with the real Firebase
      # config so the released AAB targets the real FCM project. Dummy stays committed
      # for local/PR/debug builds (fork PRs have no secret access). See features/notifications/README.md.
      - name: Decode google-services.json
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'google-services.json'
          fileDir: 'androidApp/'
          encodedString: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build AppBundle
        run: ./gradlew :androidApp:bundleRelease --no-daemon --no-configuration-cache --no-build-cache -x test
        env:
          ORG_GRADLE_PROJECT_APP_VERSION: ${{ inputs.app_version }}
          CLIENT_BUILD_TOKEN: ${{ steps.build_token.outputs.token }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PLAY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_PLAY_STORE_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PLAY_STORE_PASSWORD }}

      - name: Upload AppBundle
        uses: actions/upload-artifact@v7
        with:
          name: appbundle
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab

  release:
    name: Release
    needs: [build-appbundle]
    runs-on: ubuntu-latest
    steps:
      - name: Download aab from build
        uses: actions/download-artifact@v8
        with:
          name: appbundle

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configurationJson: |
            {
              "categories": [
                {
                  "title": "## 🚀 New Features",
                  "labels": [
                    "feature"
                  ]
                },
                {
                  "title": "## 🐛 Bugs fixed",
                  "labels": [
                    "bug"
                  ]
                },
                {
                  "title": "## 🧪 Updated Translations",
                  "labels": [
                    "translations"
                  ]
                },
                {
                  "title": "## 💬 Minor Changes",
                  "labels": [
                    "cleanup / restructuring",
                    "dependencies"
                  ]
                }
              ],
              "pr_template": "- #{{TITLE}} by @#{{AUTHOR}} in ##{{NUMBER}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: mikepenz/action-gh-release@v3
        with:
          body: ${{ steps.github_release.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Play Store Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: de.tabmates.androidapp
          releaseFiles: androidApp-release.aab
          track: internal
