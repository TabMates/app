name: Deploy Web

# Publishes the wasmJs production bundle to GitHub Pages (custom domain, see CNAME step).
# The backend it talks to is baked in at build time from the *_WEB secrets; COOP/COEP headers
# come from coi-serviceworker.js at runtime because Pages cannot set response headers, and the
# CSP is injected below as a <meta> tag for the same reason. See "Web hosting requirements"
# in README.md.

on:
  workflow_call:

env:
  # BuildKonfig requires all three defaults even though the *_WEB overrides
  # replace the URLs in the web bundle.
  API_KEY: ${{ secrets.API_KEY }}
  BASE_URL_HTTP: ${{ secrets.BASE_URL_HTTP }}
  BASE_URL_WS: ${{ secrets.BASE_URL_WS }}
  BASE_URL_HTTP_WEB: ${{ secrets.BASE_URL_HTTP_WEB }}
  BASE_URL_WS_WEB: ${{ secrets.BASE_URL_WS_WEB }}
  TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
  FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
  WEB_DOMAIN: app.tabmates.de
  BASE_URL_PUBLIC: https://app.tabmates.de

jobs:
  build:
    name: Build Web Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build wasmJs production distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Inject offline precache manifest into the service worker
        # coi-serviceworker.js also runs the offline app-shell cache (see docs/WEB_DEPLOYMENT.md);
        # this lists every real build output so `install` can precache the whole app, not just
        # pages a user happened to visit online. Embedded directly in the service worker's own
        # script rather than a fetch()'d/imported side file: browsers only re-run `install` when
        # the service worker's own script bytes change, so a side manifest file would silently
        # stop taking effect on deploys that don't touch this file's source.
        run: |
          DIST=composeApp/build/dist/wasmJs/productionExecutable
          MANIFEST_JSON=$(cd "$DIST" && find . -type f \
              ! -name "*.map" \
              ! -name "*.LICENSE.txt" \
              ! -name "404.html" \
              ! -path "./.well-known/*" \
              -printf '%P\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "$MANIFEST_JSON" | jq empty
          COUNT=$(echo "$MANIFEST_JSON" | jq 'length')
          echo "Precaching $COUNT asset(s)"
          sed -i "s#const PRECACHE_MANIFEST = \[\];#const PRECACHE_MANIFEST = $MANIFEST_JSON;#" "$DIST/coi-serviceworker.js"
          grep -q 'const PRECACHE_MANIFEST = \["' "$DIST/coi-serviceworker.js"
          NEW_COUNT=$(sed -n 's/^.*const PRECACHE_MANIFEST = \(\[.*\]\);.*$/\1/p' "$DIST/coi-serviceworker.js" | jq 'length')
          [ "$COUNT" = "$NEW_COUNT" ]

      - name: Inject Content-Security-Policy meta tag
        # Pages cannot serve a CSP header; a <meta> tag covers everything except
        # frame-ancestors. Injected only into the deployed bundle so the dev server
        # (different WS scheme, same-origin proxy) is unaffected. connect-src needs
        # origins, not URLs with paths, hence the sed strip.
        run: |
          DIST=composeApp/build/dist/wasmJs/productionExecutable
          HTTP_ORIGIN=$(echo "$BASE_URL_HTTP_WEB" | sed -E 's#^([a-z]+://[^/]+).*#\1#')
          WS_ORIGIN=$(echo "$BASE_URL_WS_WEB" | sed -E 's#^([a-z]+://[^/]+).*#\1#')
          CSP="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; connect-src 'self' $HTTP_ORIGIN $WS_ORIGIN https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://www.gstatic.com https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'"
          sed -i "s#<head>#<head><meta http-equiv=\"Content-Security-Policy\" content=\"$CSP\">#" "$DIST/index.html"
          grep -q "Content-Security-Policy" "$DIST/index.html"

      - name: Add CNAME for custom domain
        # Actions-sourced Pages deployments replace the whole artifact, so the CNAME
        # file must be part of every deploy or GitHub drops the domain association.
        run: echo "$WEB_DOMAIN" > composeApp/build/dist/wasmJs/productionExecutable/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
          # Default excludes dotfiles/dotdirs from the tarball — silently drops
          # .well-known/assetlinks.json
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
