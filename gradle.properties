#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Compose Desktop hot reload (hotRunDesktop)
mainClass=de.tabmates.composeapp.MainKt

# Fallback for local and PR builds only — release CI overrides it from the git tag via
# ORG_GRADLE_PROJECT_APP_VERSION. Keep it at or below the latest tag: the backend's
# client-version gate rejects a version that does not exist in the tag stream, and a value
# ahead of it also makes the in-app update check believe the build is permanently current.
APP_VERSION=0.0.24
